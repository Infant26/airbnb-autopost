      const IMGS = {}; ['g1', 'g2', 'v1', 'v2', 'h1', 'h2', 'w1', 'u1'].forEach((k) => { IMGS[k] = document.getElementById('im-' + k); });
      const CARDS = [

        const sh = g.createLinearGradient(0, ph - 260, 0, ph); sh.addColorStop(0, 'rgba(18,10,32,0)'); sh.addColorStop(1, 'rgba(18,10,32,1)'); g.fillStyle = sh; g.fillRect(0, ph - 260, W, 260);
        if (st.play > 0.01) { g.fillStyle = 'rgba(255,60,90,' + (0.9 * st.play) + ')'; g.beginPath(); g.arc(46, 46, 12, 0, 6.283); g.fill(); g.fillStyle = 'rgba(255,246,232,' + (0.9 * st.play) + ')'; g.font = '800 26px Inter, sans-serif'; g.textAlign = 'left'; g.fillText('PREVIEW', 68, 56); }
