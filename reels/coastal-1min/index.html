  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16"

        <div id="d-2" class="big gold x3d" style="top: 628px; font-size: 76px; letter-spacing: -2px; left: 0; right: 0; white-space: nowrap">1 MINUTE TO ROCK BEACH</div>
        <div id="d-3" style="position: absolute; left: 0; right: 0; top: 860px; text-align: center; opacity: 0">

      <audio id="t6" class="clip" data-start="6.5" data-duration="0.3" src="assets/sfx/click-soft.mp3" data-volume="0.5" data-track-index="22"></audio>
      <audio id="t7" class="clip" data-start="7.0" data-duration="0.3" src="assets/sfx/click-soft.mp3" data-volume="0.5" data-track-index="23"></audio>
      <audio id="t8" class="clip" data-start="7.5" data-duration="0.3" src="assets/sfx/click-soft.mp3" data-volume="0.5" data-track-index="24"></audio>
      <audio id="t9" class="clip" data-start="8.0" data-duration="0.3" src="assets/sfx/click-soft.mp3" data-volume="0.5" data-track-index="25"></audio>
      <audio id="t10" class="clip" data-start="8.5" data-duration="0.3" src="assets/sfx/click-soft.mp3" data-volume="0.5" data-track-index="26"></audio>
      <audio id="t11" class="clip" data-start="9.0" data-duration="0.3" src="assets/sfx/click-soft.mp3" data-volume="0.5" data-track-index="27"></audio>

    <script>
      let seed = 23; const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const canvas = document.getElementById('gl');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(new THREE.Color('#f7ead0'), 70, 300);
      const camera = new THREE.PerspectiveCamera(50, 1080 / 1920, 0.1, 700);
      const hemi = new THREE.HemisphereLight('#fff6e6', '#8a7a62', 1.3);
      const sun = new THREE.DirectionalLight('#fff1dc', 2.1);
      sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, far: 130 }); sun.shadow.bias = -0.0005;
      scene.add(hemi, sun, sun.target);
      const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85 }, o));
      const glow = (color) => new THREE.MeshBasicMaterial({ color, toneMapped: false });
      function box(p, w, h, d, m, x, y, z) { const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true; p.add(mesh); return mesh; }
      function cyl(p, rt, rb, h, m, x, y, z, seg = 16) { const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); mesh.position.set(x, y, z); mesh.castShadow = mesh.receiveShadow = true; p.add(mesh); return mesh; }
      const clamp01 = (p) => Math.min(1, Math.max(0, p));
      const back = (p) => { p = clamp01(p); const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
      const smooth = (p) => { p = clamp01(p); return p * p * (3 - 2 * p); };

      // Walk timing: where along the street the camera is at time t, so things can react just ahead of it
      const WALK0 = 3.0, WALK1 = 10.0, Z0 = -3, Z1 = -58.2;
      const tAtZ = (z) => WALK0 + (Z0 - z) / (Z0 - Z1) * (WALK1 - WALK0);

      function textPlane(txt, w, h, color, px, shadow) {
        const c = document.createElement('canvas'); c.width = 2048; c.height = Math.round(2048 * h / w); const g = c.getContext('2d');
        g.font = '900 ' + px + 'px Helvetica, Arial, sans-serif'; const fit = (c.width - 60) / g.measureText(txt).width;
        if (fit < 1) { px = Math.floor(px * fit); g.font = '900 ' + px + 'px Helvetica, Arial, sans-serif'; }
        g.textAlign = 'center'; g.textBaseline = 'middle';
        if (shadow) { g.fillStyle = shadow; g.fillText(txt, c.width / 2 + 10, c.height / 2 + 16); }
        g.fillStyle = color; g.fillText(txt, c.width / 2, c.height / 2);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
        return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, transparent: true, toneMapped: false, depthWrite: false, fog: false }));
      }

      // ---------- Street, promenade ----------
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 121.6), mat('#cdbf9f')); ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, -0.8); ground.receiveShadow = true; scene.add(ground);
      const lane = new THREE.Mesh(new THREE.PlaneGeometry(7, 70), mat('#a99a7d')); lane.rotation.x = -Math.PI / 2; lane.position.set(0, 0.01, -20); lane.receiveShadow = true; scene.add(lane);
      for (let k = 0; k < 34; k++) box(scene, 6.6, 0.012, 0.09, mat('#94866b'), 0, 0.016, 2 - k * 1.65);
      const curbM = mat('#e7ddc8');
      for (const sx of [-3.35, 3.35]) box(scene, 0.3, 0.12, 62, curbM, sx, 0.06, -25);
      const prom = new THREE.Mesh(new THREE.PlaneGeometry(400, 7), mat('#e6dccb')); prom.rotation.x = -Math.PI / 2; prom.position.set(0, 0.02, -58); prom.receiveShadow = true; scene.add(prom);
      box(scene, 400, 0.45, 0.4, mat('#f7f2e8'), 0, 0.22, -61.6);

      // ---------- Heritage houses ----------
      const FH = 3.2, W = 5.8, D = 6;
      const WALLS = ['#e9b949', '#f4efe3', '#e3a63a', '#efe6cf', '#e8c25c', '#d98f5c', '#f2e9d2', '#e6b448'];
      const SHUTS = ['#2f6f63', '#3d5f7a', '#6b3f2a', '#2f5b55', '#5b6e3a'];
      const trimM = mat('#fbf7ee'), doorM = mat('#5a321d');
      const dominos = [];
      function buildHouse(o) {
        const g = new THREE.Group(), H = o.floors * FH, wm = mat(o.wall);
        for (let f = 0; f < o.floors; f++) box(g, W, FH, D, wm, 0, f * FH + FH / 2, 0);
        const shutM = mat(o.shut, { roughness: 0.6 }), glassM = mat('#2a2f33', { roughness: 0.3 });
        for (let f = 1; f <= o.floors; f++) box(g, W + 0.14, 0.2, 0.3, trimM, 0, f * FH - 0.06, D / 2 + 0.08);
        box(g, W + 0.14, 0.16, 0.34, trimM, 0, H + 0.92, D / 2 - 0.1);
        for (let k = 0; k < 9; k++) box(g, 0.14, 0.72, 0.14, trimM, -W / 2 + 0.35 + k * (W - 0.7) / 8, H + 0.48, D / 2 - 0.1);
        for (let f = 0; f < o.floors; f++) {
          const xs = f === 0 ? [-1.9, 1.9] : [-1.9, 0, 1.9], h = f === 0 ? 1.5 : 1.85, wdt = 0.9, y = f * FH + (f === 0 ? 1.55 : 1.7);
          xs.forEach((x) => {
            box(g, wdt + 0.26, h + 0.26, 0.08, trimM, x, y, D / 2 + 0.03);
            box(g, wdt + 0.46, 0.14, 0.22, trimM, x, y + h / 2 + 0.2, D / 2 + 0.1);
            box(g, wdt, h, 0.06, glassM, x, y, D / 2 + 0.06);
            [-1, 1].forEach((sgn) => {
              const piv = new THREE.Group(); piv.position.set(x + sgn * wdt / 2, y, D / 2 + 0.1);
              box(piv, wdt / 2, h, 0.05, shutM, -sgn * wdt / 4, 0, 0);
              for (let s = 0; s < 6; s++) box(piv, wdt / 2 - 0.06, 0.03, 0.07, shutM, -sgn * wdt / 4, -h / 2 + 0.2 + s * (h - 0.4) / 5, 0.02);
              g.add(piv); dominos.push([piv, sgn, o.t + f * 0.08 + rnd() * 0.12]);
            });
          });
        }
        box(g, 1.5, 2.6, 0.08, trimM, 0, 1.3, D / 2 + 0.03); box(g, 1.2, 2.35, 0.08, doorM, 0, 1.18, D / 2 + 0.07);
        box(g, 1.7, 0.16, 0.3, trimM, 0, 2.7, D / 2 + 0.1);
        return { g, H };
      }
      const blooms = [];
      const pinkMs = [mat('#d63384', { flatShading: true }), mat('#e8559c', { flatShading: true }), mat('#c2185b', { flatShading: true })], leafM = mat('#3f7a3c', { flatShading: true });
      function bloom(p, x, y, z, n, tg, spread = 1) {
        const g = new THREE.Group(); g.position.set(x, y, z);
        for (let k = 0; k < n; k++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16 + rnd() * 0.2, 0), rnd() < 0.25 ? leafM : pinkMs[k % 3]);
          const a = rnd() * 6.28; m.position.set(Math.cos(a) * rnd() * 0.9 * spread, -rnd() * 1.6 * spread + 0.3, Math.sin(a) * 0.25 + 0.15); m.castShadow = true; g.add(m); }
        g.scale.setScalar(0.0001); p.add(g); blooms.push([g, tg]); return g;
      }
      const SLOT = (k) => -3 - k * 6.1;
      for (let side = -1; side <= 1; side += 2) {
        for (let k = 0; k < 9; k++) {
          if (side === 1 && k === 0) continue;   // our courtyard sits here
          const tg = tAtZ(SLOT(k)) - 1.15;
          const h = buildHouse({ floors: rnd() < 0.45 ? 3 : 2, wall: WALLS[(k * 3 + (side > 0 ? 1 : 0)) % WALLS.length], shut: SHUTS[(k + (side > 0 ? 2 : 0)) % SHUTS.length], t: tg });
          h.g.position.set(side * (3.5 + D / 2), 0, SLOT(k)); h.g.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2; scene.add(h.g);
          if ((k + (side > 0 ? 1 : 0)) % 2 === 0) bloom(h.g, -W / 2 + 0.4, h.H + 0.6, D / 2 + 0.2, 28, tg - 0.1);
          if (k % 3 === 1) bloom(h.g, W / 2 - 0.4, FH + 0.4, D / 2 + 0.15, 22, tg);
        }
      }
      // back rows so no sky shows through the gaps
      const blockM = WALLS.map((c) => mat(c));
      for (const bx of [-13, 13]) for (let z = 3; z > -54; z -= 6.1) { const h = (rnd() < 0.5 ? 3 : 4) * FH; box(scene, 7, h, 6.2, blockM[Math.floor(rnd() * blockM.length)], bx, h / 2, z - 3); }
      // street lamps and pots
      for (let k = 0; k < 6; k++) { const side = k % 2 ? 1 : -1, z = -8 - k * 8.6;
        cyl(scene, 0.06, 0.09, 4.2, mat('#1d2523'), side * 3.2, 2.1, z); box(scene, 0.7, 0.06, 0.06, mat('#1d2523'), side * 2.9, 4.15, z);
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), glow('#fff3d0')); b.position.set(side * 2.6, 3.98, z); scene.add(b); }
      for (let k = 0; k < 9; k++) { const side = k % 2 ? -1 : 1, z = -10 - k * 5.7; cyl(scene, 0.26, 0.18, 0.5, mat('#b6724b'), side * 3.2, 0.25, z); const l = new THREE.Mesh(new THREE.IcosahedronGeometry(0.46, 0), leafM); l.position.set(side * 3.2, 0.82, z); l.castShadow = true; scene.add(l); }

      // ---------- Our courtyard and gate (the street's right side, facing -x) ----------
      const YARD = new THREE.Group(); scene.add(YARD);
      const yardWall = mat('#f2e6c8'), GZ = SLOT(0);
      const yf = new THREE.Mesh(new THREE.PlaneGeometry(10, 7), mat('#b5764f')); yf.rotation.x = -Math.PI / 2; yf.position.set(8.5, 0.03, GZ); yf.receiveShadow = true; YARD.add(yf);
